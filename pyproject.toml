[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msproject-mcp"
version = "0.8.0"
description = "MCP server for controlling Microsoft Project via COM automation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "John Saunders", email = "john.es.saunders@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
]

dependencies = [
    # mcp ceiling avoids pyjwt[crypto] -> cryptography ARM64 build failure
    "mcp>=1.0,<1.20",
    "python-dateutil>=2.8.0",
    "psutil>=5.9.0",
    # pywin32 only on Windows (COM automation requires it)
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
mpxj = [
    "mpxj>=0.0.1",
    "jpype1>=1.4",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0",
]

[project.scripts]
msproject-mcp = "server:main"

[project.urls]
Homepage = "https://github.com/slaughters85j/MS-Procject-MCP"
Issues = "https://github.com/slaughters85j/MS-Procject-MCP/issues"

[tool.setuptools]
py-modules = ["server"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/integration --ignore=tests/fixtures -v"
